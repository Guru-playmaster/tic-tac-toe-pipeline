<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Tic-Tac-Toe</h1>
    <p class="subtitle">Play with a friend or challenge the computer</p>
    <p class="status" id="status" aria-live="polite">Create a room or join with a room code.</p>

    <div class="mode-picker" role="group" aria-label="Game mode">
      <button class="action" id="mode-room" type="button" aria-pressed="true">2 players / room</button>
      <button class="action" id="mode-computer" type="button" aria-pressed="false">Play computer</button>
    </div>
    <p class="player-info" id="computer-info" hidden>You are X. The computer plays O.</p>

    <section class="lobby" id="lobby" aria-label="Online game setup">
      <label for="server-url">Game server URL</label>
      <input id="server-url" type="url" autocomplete="url" placeholder="https://game-server.example.com">
      <p class="field-help">Both players must use the same game server.</p>
      <button class="action" id="create-room" type="button">Create room</button>
      <div class="join-row">
        <label class="visually-hidden" for="room-input">Room code</label>
        <input id="room-input" type="text" inputmode="text" maxlength="6" autocomplete="off" placeholder="ROOM CODE">
        <button class="action" id="join-room" type="button">Join room</button>
      </div>
    </section>

    <section class="room" id="room" aria-label="Online game room" hidden>
      <div class="room-heading">
        <p>Room <strong id="room-code"></strong></p>
        <button class="small-action" id="copy-invite" type="button">Copy invite</button>
      </div>
      <p class="player-info" id="player-info"></p>
      <button class="small-action reconnect" id="reconnect" type="button" hidden>Reconnect</button>
    </section>

    <section class="board" id="board" aria-label="Tic-Tac-Toe board">
      <button class="cell" type="button" aria-label="Row 1, column 1"></button>
      <button class="cell" type="button" aria-label="Row 1, column 2"></button>
      <button class="cell" type="button" aria-label="Row 1, column 3"></button>
      <button class="cell" type="button" aria-label="Row 2, column 1"></button>
      <button class="cell" type="button" aria-label="Row 2, column 2"></button>
      <button class="cell" type="button" aria-label="Row 2, column 3"></button>
      <button class="cell" type="button" aria-label="Row 3, column 1"></button>
      <button class="cell" type="button" aria-label="Row 3, column 2"></button>
      <button class="cell" type="button" aria-label="Row 3, column 3"></button>
    </section>
    <button class="reset" id="reset" type="button" hidden>Play again</button>
    <p class="help" id="help">Share the invite link, or open this page on another origin and enter the same server URL and room code.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
